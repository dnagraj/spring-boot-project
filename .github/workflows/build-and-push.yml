name: Build Scan and Push

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: demo-app

jobs:
  build-test-scan-push:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # 2. Setup Java 25
      # ----------------------------------------------------

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: demo-app/pom.xml

      # ----------------------------------------------------
      # 3. Maven build and test
      # ----------------------------------------------------

      - name: Build and test
        working-directory: demo-app
        run: |
          chmod +x mvnw
          ./mvnw clean verify

      # ----------------------------------------------------
      # 4. Configure AWS using GitHub OIDC
      # ----------------------------------------------------
      - name: Debug GitHub OIDC context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Actor: $GITHUB_ACTOR"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------
      # 5. Verify AWS identity
      # ----------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ----------------------------------------------------
      # 6. Login to Amazon ECR
      # ----------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------------------
      # 7. Build Docker image
      # ----------------------------------------------------

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            ./demo-app

      # ----------------------------------------------------
      # 8. Trivy image scan
      # ----------------------------------------------------

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # ----------------------------------------------------
      # 9. Push image to ECR
      # ----------------------------------------------------

      - name: Push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"